# Pushing a version tag (v0.1.0 …) tests and builds the app, then creates a draft GitHub release with
# pedal-thyme.html and its SHA-256 checksum attached. Review the draft and publish it from the Releases page.
# Versions below 1.0 are marked as pre-releases.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Check the tag matches the version in package.json
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME doesn't match package.json version $v"; exit 1; fi
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash=$(cut -d' ' -f1 dist/pedal-thyme.html.sha256)
          pre=$(case "$GITHUB_REF_NAME" in v0.*) echo --prerelease;; esac)
          gh release create "$GITHUB_REF_NAME" dist/pedal-thyme.html dist/pedal-thyme.html.sha256 $pre \
            --draft --title "Pedal Thyme $GITHUB_REF_NAME" \
            --notes "Download pedal-thyme.html and double-click it. SHA-256: \`$hash\`"
